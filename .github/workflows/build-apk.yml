name: Gerar APK Android (mundo calmo)

on: [push, workflow_dispatch]

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto do ZIP se necessário
        run: |
          if [ ! -f "package.json" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -iname '*.zip' | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERRO: Nenhum arquivo .zip nem package.json encontrado na aba Code do repositório."
              exit 1
            fi
            mkdir -p /tmp/app_src
            unzip -o "$ZIP_FILE" -d /tmp/app_src
            PROJ_DIR=$(dirname "$(find /tmp/app_src -maxdepth 3 -name 'package.json' | head -n 1)")
            cp -a "$PROJ_DIR/." .
          fi

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK 36
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_BIN="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true
          "$SDK_BIN" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências e gerar build web
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sincronizar projeto Android com Capacitor
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "mundo calmo" "com.mundocalmo.app" --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Compilar APK Android
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar arquivo mundo-calmo.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk mundo-calmo.apk

      - name: Disponibilizar mundo-calmo.apk para download
        uses: actions/upload-artifact@v4
        with:
          name: mundo-calmo-apk
          path: mundo-calmo.apk
          retention-days: 30
